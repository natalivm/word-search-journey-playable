name: Validate and Deploy Pages

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Generate every level and verify the puzzles are solvable
        run: npm run verify

      - name: Build the game
        run: npm run build

      - name: Validate landing page and ad creative
        run: |
          test -f index.html
          test -f playable-ad/index.html
          test -f .nojekyll
          grep -q './playable-ad/' index.html
          grep -q './game/' index.html
          grep -q 'com.playvalve.wsjourney' playable-ad/index.html

      - name: Validate build output
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/icon-maskable-512.png
          node -e "JSON.parse(require('fs').readFileSync('dist/manifest.webmanifest','utf8'))"

      - name: Check the service worker pre-caches the real build output
        run: |
          node -e "
            const fs = require('fs');
            const src = fs.readFileSync('dist/sw.js', 'utf8');
            const block = src.match(/PRECACHE_START \*\/([\s\S]*?)\/\* PRECACHE_END/);
            if (!block) { console.error('Precache markers missing — did the build postStep run?'); process.exit(1); }
            const paths = [...block[1].matchAll(/\"\.\/([^\"]+)\"/g)].map(m => 'dist/' + m[1]);
            if (!paths.length) { console.error('Precache list is empty.'); process.exit(1); }
            const missing = paths.filter(p => !fs.existsSync(p));
            if (missing.length) {
              console.error('Service worker pre-caches files that do not exist:');
              for (const p of missing) console.error('  ' + p);
              process.exit(1);
            }
            if (/wsj-dev/.test(src)) { console.error('Cache name was not stamped by the build.'); process.exit(1); }
            console.log('All ' + paths.length + ' pre-cached assets exist.');
          "

      - name: Package playable ZIP
        run: bash scripts/package.sh

      - name: Validate ad ZIP
        run: |
          test -f dist-ad/word-search-journey-playable.zip
          unzip -l dist-ad/word-search-journey-playable.zip | grep -q 'index.html'
          bytes="$(wc -c < dist-ad/word-search-journey-playable.zip)"
          max_bytes="$((5 * 1024 * 1024))"
          if [ "$bytes" -gt "$max_bytes" ]; then
            echo "Playable ZIP is larger than 5 MB: $bytes bytes"
            exit 1
          fi

      - name: Upload playable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-search-journey-playable
          path: dist-ad/word-search-journey-playable.zip

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the game
        run: npm run build

      - name: Package playable ZIP
        run: bash scripts/package.sh

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R playable-ad docs artifacts _site/
          cp -R dist _site/game
          cp -R dist-ad _site/dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
